<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>C2-Pay · ระบบเบิกจ่าย</title>
<meta name="theme-color" content="#1F3428">
<script>try{var t=localStorage.getItem('c2pay_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="C2-Pay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">
<link rel="stylesheet" href="style.css?v=20261105x">
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite">
  <div class="sp-bg" aria-hidden="true">
    <span style="--x:8%;--d:0s;--s:1">฿</span><span style="--x:22%;--d:2.4s;--s:.7">฿</span><span style="--x:78%;--d:1.2s;--s:.9">฿</span><span style="--x:90%;--d:3.4s;--s:.6">฿</span>
    <i style="--x:15%;--d:1.6s"></i><i style="--x:68%;--d:.4s"></i><i style="--x:85%;--d:2.8s"></i><i style="--x:40%;--d:3.9s"></i>
  </div>
  <div class="sp-mid">
    <svg class="sp-scene" viewBox="0 0 320 250" aria-hidden="true">
      <g class="coins" transform="translate(160 0)"><g class="coin c1"><circle r="13" fill="#E9C46A"/><circle r="10" fill="none" stroke="#C9A23F" stroke-width="1.6"/><text y="5" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="14" fill="#8A6A1E">฿</text></g><g class="coin c2"><circle r="13" fill="#E9C46A"/><circle r="10" fill="none" stroke="#C9A23F" stroke-width="1.6"/><text y="5" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="14" fill="#8A6A1E">฿</text></g><g class="coin c3"><circle r="13" fill="#E9C46A"/><circle r="10" fill="none" stroke="#C9A23F" stroke-width="1.6"/><text y="5" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="14" fill="#8A6A1E">฿</text></g></g>
      <g transform="translate(160 78)"><g class="spark"><path d="M0-9v18M-9 0h18" stroke="#E9C46A" stroke-width="2.4" stroke-linecap="round"/></g></g>
      <image class="wallet" href="img/icon-512.png" x="108" y="66" width="104" height="104"/>
      <g class="road" transform="translate(0 214)">
        <path class="route" d="M22 0H298" stroke="rgba(255,255,255,.35)" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
        <g transform="translate(40 -4)"><g class="pin p1"><path d="M0-22c-6 0-10 4.5-10 10 0 7 10 16 10 16s10-9 10-16c0-5.5-4-10-10-10z" fill="#D2DCD8"/><circle cy="-12" r="3.6" fill="#3F654D"/></g></g>
        <g transform="translate(160 -4)"><g class="pin p2"><path d="M0-22c-6 0-10 4.5-10 10 0 7 10 16 10 16s10-9 10-16c0-5.5-4-10-10-10z" fill="#D2DCD8"/><circle cy="-12" r="3.6" fill="#3F654D"/></g></g>
        <g transform="translate(280 -4)"><g class="pin p3"><path d="M0-22c-6 0-10 4.5-10 10 0 7 10 16 10 16s10-9 10-16c0-5.5-4-10-10-10z" fill="#E9C46A"/><text y="-8" text-anchor="middle" font-family="Chakra Petch,sans-serif" font-weight="700" font-size="10" fill="#3F654D">฿</text></g></g>
        <g class="truck"><g transform="translate(-24 -22)">
          <path d="M2 8h26v14H2z" fill="#fff"/><path d="M28 10h9l7 7v5H28z" fill="#fff"/><path d="M31 12h5l4.5 4.5H31z" fill="#7FA08C"/>
          <rect x="4" y="11" width="12" height="3" rx="1.5" fill="#D2DCD8"/>
          <g transform="translate(11 23)"><g class="wh"><circle r="4.6" fill="#1F3428"/><circle r="1.8" fill="#D2DCD8"/><path d="M0-3.4V3.4M-3.4 0H3.4" stroke="#D2DCD8" stroke-width="1"/></g></g>
          <g transform="translate(35 23)"><g class="wh"><circle r="4.6" fill="#1F3428"/><circle r="1.8" fill="#D2DCD8"/><path d="M0-3.4V3.4M-3.4 0H3.4" stroke="#D2DCD8" stroke-width="1"/></g></g>
          <path class="dust" d="M-2 20h-7M-1 16h-5" stroke="rgba(255,255,255,.5)" stroke-width="1.6" stroke-linecap="round"/>
        </g></g>
      </g>
    </svg>
    <div class="sp-name">C2-Pay</div>
    <div class="sp-sub">เบิกค่าเดินทาง · เงินทดรอง · เงินสดย่อย</div>
    <div class="sp-meter" aria-hidden="true"><span><b class="km"></b> กม.</span><span class="dot"></span><span>฿ <b class="baht"></b></span></div>
    <div class="sp-bar" aria-hidden="true"><i></i></div>
    <div class="sp-msg" id="spMsg">กำลังเริ่มระบบ…</div>
  </div>
  <img class="sp-foot" src="img/logo-white.png" alt="C2TECH">
</div>
<div class="auth" id="auth" hidden></div>
<script>setTimeout(function(){var m=document.getElementById('spMsg');if(m&&document.getElementById('splash'))m.textContent='โหลดช้ากว่าปกติ · ตรวจอินเทอร์เน็ต แล้วลองรีเฟรชหน้า';},15000);</script>

<div class="stage" id="stage" hidden>
  <div class="app" id="app">
    <aside class="side" aria-label="เมนูหลัก">
      <div class="logo"><img class="lg-ic" src="img/icon-192.png" alt=""><div class="lg-tx"><b>C2-Pay</b><small>ระบบเบิกจ่าย</small></div></div>
      <nav id="sidenav" style="display:flex;flex-direction:column;gap:3px"></nav>
      <div class="foot" id="sidefoot"></div>
    </aside>
    <button class="sbt" data-act="mini" aria-label="ย่อ/ขยายเมนู"><span class="ms" style="font-size:18px">chevron_left</span></button>
    <div class="maincol">
      <header class="top"><img class="tlogo" src="img/icon-192.png" alt="C2-Pay"><div><div class="crumb" id="crumb">C2-Pay</div><h1 id="ttl"></h1></div><div class="acts" id="acts"></div></header>
      <main class="view" id="view"></main>
    </div>
    <nav class="bnav" id="bnav" aria-label="เมนูล่าง"></nav>
    <div class="scrim" id="scrim" data-act="closeDrawer"></div>
    <aside class="drawer" id="drawer" aria-label="รายละเอียดใบเบิก"></aside>
    <div class="toast" id="toast" role="status"><span class="ms">check_circle</span><span id="toastTxt"></span></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
<script src="app.js?v=20261105x"></script>
</body>
</html>
